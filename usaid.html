<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USAID Rwanda</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f4f6f9;
}

/* NAV */
nav{
    background:#0d47a1;
    color:white;
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
}

/* HERO */
.hero{
    height:65vh;
    background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1521791136064-7986c2920216');
    background-size:cover;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
}

/* SECTIONS */
.section{
    padding:50px 8%;
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* FORM */
form{
    max-width:500px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input, textarea{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    padding:10px;
    background:#ffd700;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

.back-home{
   position: fixed;
   top: 90px;
   left: 20px;
   background:#009639;
   color:white;
   padding:10px 15px;
   border-radius:8px;
   text-decoration:none;
   font-weight:600;
   z-index:999;
}

.back-home:hover{
   background:#007a2a;
}
/* FOOTER */
footer{
    background:black;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<a href="martha.html" class="back-home">← Back to Home</a>


<!-- FOCUS -->
<div class="section">
<h2>Focus Areas</h2>

<div class="grid">

    <div class="card">
        <h3>🏥 Health</h3>
        <p>HIV, maternal health, nutrition programs.</p>
    </div>

    <div class="card">
        <h3>📚 Education</h3>
        <p>Improving learning quality and access.</p>
    </div>

    <div class="card">
        <h3>💼 Economic Growth</h3>
        <p>Supporting youth and small businesses.</p>
    </div>

</div>
</div>

<!-- CONTACT -->
<div class="section">
<h2>Contact USAID Rwanda</h2>

<form id="contactForm">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <textarea id="message" placeholder="Your Message" required></textarea>
    <button type="submit">Send</button>
</form>

<p id="status"></p>

<div id="messages"></div>
</div>

<!-- FOOTER -->
<footer>
    © 2026 USAID Rwanda
</footer>

<script>

// SAVE MESSAGE
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();

    let data = JSON.parse(localStorage.getItem("usaidMessages")) || [];

    data.push({
        name: name.value,
        email: email.value,
        message: message.value,
        date: new Date().toLocaleString()
    });

    localStorage.setItem("usaidMessages", JSON.stringify(data));

    status.innerText = "Message sent ✔";

    this.reset();

    show();
});

// SHOW MESSAGES
function show(){
    let data = JSON.parse(localStorage.getItem("usaidMessages")) || [];
    let out = "";

    data.forEach(m=>{
        out += `
        <div class="card">
            <b>${m.name}</b><br>
            ${m.email}<br>
            <small>${m.date}</small>
            <p>${m.message}</p>
        </div>`;
    });

    messages.innerHTML = out;
}

show();

</script>

</body>
</html>
