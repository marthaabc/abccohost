<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get Started</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#11998e,#38ef7d);
}

/* CARD */
.card{
width:380px;
background:white;
padding:40px 30px;
border-radius:20px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,0.25);
transition:0.4s;
}

.card:hover{
transform:translateY(-10px);
}

/* ICON */
.icon{
width:95px;
height:95px;
background:#e9fff3;
margin:auto;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
margin-bottom:20px;
}

.icon i{
font-size:48px;
color:#008000;
}

/* TITLE */
.card h2{
font-size:34px;
color:#006400;
margin-bottom:15px;
}

/* TEXT */
.card p{
font-size:18px;
color:#555;
line-height:1.6;
margin-bottom:25px;
}

/* BUTTON */
button{
background:#008000;
color:white;
border:none;
padding:14px 28px;
font-size:18px;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#006400;
transform:scale(1.05);
}

</style>
</head>

<body>

<div class="card">

<div class="icon">
<i class="fa-solid fa-rocket"></i>
</div>

<h2>Get Started</h2>

<p>
Begin your journey today and explore
innovative programs, projects, and
opportunities for TVET students.
</p>

<button onclick="startNow()">
Get Started
</button>

</div>

<script>

function startNow(){
alert("Welcome! Your journey starts now.");
}

</script>

</body>
</html>
