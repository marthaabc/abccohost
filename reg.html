<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | ABC CO MIS</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --yellow: #FFD000;
  --yellow-deep: #F5C200;
  --yellow-glow: rgba(255,208,0,0.12);
  --black: #0D0D0D;
  --black-soft: #1A1A1A;
  --white: #FAFAF7;
  --gray-100: #F4F3EF;
  --gray-400: #999890;
  --gray-600: #555450;
  --ease: cubic-bezier(0.22,1,0.36,1);
  --transition: 0.35s var(--ease);
  --radius: 12px;
  --radius-sm: 8px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--black);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* GRID BG */
body::after {
  content:''; position:fixed; inset:0;
  background-image: linear-gradient(rgba(255,208,0,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,208,0,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events:none; z-index:0;
}

/* GLOW */
body::before {
  content:''; position:fixed;
  top:-200px; left:50%; transform:translateX(-50%);
  width:700px; height:500px;
  background: radial-gradient(ellipse, rgba(255,208,0,0.07) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}

/* NAVBAR */
nav {
  display:flex; justify-content:space-between; align-items:center;
  padding:0 56px; background:rgba(13,13,13,0.95);
  backdrop-filter: blur(10px);
  position:sticky; top:0; z-index:1000; height:68px;
  border-bottom:1px solid rgba(255,208,0,0.1);
}
.nav-logo { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:2px; text-decoration:none; color:var(--yellow); }
.nav-logo span { color:rgba(255,208,0,0.4); }
.nav-links { display:flex; gap:2px; list-style:none; align-items:center; }
.nav-links li a {
  text-decoration:none; color:rgba(255,255,255,0.55);
  font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:13px;
  letter-spacing:0.5px; padding:7px 14px; border-radius:var(--radius-sm);
  transition:var(--transition); text-transform:uppercase;
}
.nav-links li a:hover { color:var(--yellow); background:rgba(255,208,0,0.08); }
.nav-apply a { background:var(--yellow) !important; color:var(--black) !important; font-weight:700; }

.hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; background:none; border:none; padding:4px; }
.hamburger span { width:24px; height:2px; background:var(--yellow); border-radius:2px; transition:0.3s; display:block; }
.hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity:0; }
.hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

.mobile-menu {
  display:none; flex-direction:column;
  position:fixed; top:68px; left:0; right:0;
  background:var(--black-soft); padding:20px; z-index:999;
  border-bottom:2px solid var(--yellow);
}
.mobile-menu.open { display:flex; }
.mobile-menu a {
  text-decoration:none; padding:12px 16px; color:rgba(255,255,255,0.75);
  font-family:'Space Grotesk',sans-serif; font-weight:500; border-radius:var(--radius-sm);
  margin-bottom:4px; font-size:14px; transition:0.2s;
}
.mobile-menu a:hover { background:rgba(255,208,0,0.1); color:var(--yellow); }

/* MAIN LAYOUT */
.page-wrap {
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:48px 20px; position:relative; z-index:1;
}

.register-card {
  width:100%; max-width:460px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,208,0,0.12);
  border-radius: 20px;
  padding: 44px 40px;
  backdrop-filter: blur(20px);
  animation: slideUp 0.7s var(--ease) both;
}

@keyframes slideUp {
  from { opacity:0; transform:translateY(36px); }
  to { opacity:1; transform:translateY(0); }
}

/* CARD HEADER */
.card-header { text-align:center; margin-bottom:36px; }

.card-icon {
  width:56px; height:56px;
  background:var(--yellow-glow);
  border:1px solid rgba(255,208,0,0.2);
  border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 18px;
}
.card-icon i { font-size:22px; color:var(--yellow); }

.card-header h2 {
  font-family:'Bebas Neue',sans-serif;
  font-size:36px; letter-spacing:1px; color:var(--white);
  margin-bottom:6px;
}
.card-header p {
  font-size:13px; color:var(--gray-400); font-weight:300;
}

/* FORM */
.input-group { margin-bottom:18px; }

.input-group label {
  display:flex; align-items:center; gap:7px;
  font-family:'Space Grotesk',sans-serif;
  font-size:11px; font-weight:600;
  text-transform:uppercase; letter-spacing:1px;
  color:rgba(255,255,255,0.5);
  margin-bottom:8px;
}
.input-group label i { font-size:11px; color:var(--yellow-deep); }

.input-group input {
  width:100%; padding:13px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius-sm);
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:14px; font-weight:300;
  outline:none;
  transition:var(--transition);
}
.input-group input::placeholder { color:rgba(255,255,255,0.2); }
.input-group input:focus {
  border-color: rgba(255,208,0,0.5);
  background: rgba(255,208,0,0.04);
  box-shadow: 0 0 0 3px rgba(255,208,0,0.08);
}

/* PASSWORD WRAPPER */
.pass-wrap { position:relative; }
.pass-wrap input { padding-right:44px; }
.pass-toggle {
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer;
  color:rgba(255,255,255,0.3); font-size:14px; transition:0.2s;
  padding:0;
}
.pass-toggle:hover { color:var(--yellow); }

/* SUBMIT */
.btn-submit {
  width:100%; padding:14px;
  background:var(--yellow); color:var(--black);
  border:none; border-radius:var(--radius-sm);
  font-family:'Space Grotesk',sans-serif;
  font-size:14px; font-weight:700;
  letter-spacing:0.3px; cursor:pointer;
  transition:var(--transition);
  margin-top:8px;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.btn-submit:hover {
  background:var(--yellow-deep);
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(255,208,0,0.25);
}

/* DIVIDER */
.divider {
  display:flex; align-items:center; gap:14px;
  margin:22px 0;
}
.divider::before, .divider::after {
  content:''; flex:1; height:1px;
  background:rgba(255,255,255,0.07);
}
.divider span {
  font-size:11px; color:rgba(255,255,255,0.25);
  font-family:'Space Grotesk',sans-serif; text-transform:uppercase; letter-spacing:1px;
}

/* LOGIN LINK */
.login-link {
  text-align:center;
  font-size:13px; color:rgba(255,255,255,0.35); font-weight:300;
}
.login-link a {
  color:var(--yellow); font-weight:600;
  text-decoration:none; font-family:'Space Grotesk',sans-serif;
  transition:0.2s;
}
.login-link a:hover { color:var(--yellow-deep); text-decoration:underline; }

/* FOOTER */
footer {
  background:rgba(0,0,0,0.6); color:rgba(255,255,255,0.25);
  padding:20px 56px; text-align:center;
  border-top:1px solid rgba(255,208,0,0.07);
  font-size:12px; position:relative; z-index:1;
}
footer a { color:rgba(255,208,0,0.4); text-decoration:none; }
footer a:hover { color:var(--yellow); }

/* RESPONSIVE */
@media(max-width:768px) {
  nav { padding:0 20px; }
  .nav-links { display:none; }
  .hamburger { display:flex; }
  .register-card { padding:32px 24px; }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a href="martha.html" class="nav-logo">ABC CO <span>MIS</span></a>
  <ul class="nav-links">
    <li><a href="martha.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="login.html">Login</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li class="nav-apply"><a href="apply.html">Apply Now</a></li>
    <li><a href="product.html">Product</a></li>
  </ul>
  <button class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="martha.html">🏠 Home</a>
  <a href="about.html">ℹ️ About</a>
  <a href="login.html">🔐 Login</a>
  <a href="contact.html">📞 Contact</a>
  <a href="apply.html">🚀 Apply Now</a>
</div>

<!-- FORM -->
<div class="page-wrap">
  <div class="register-card">

    <div class="card-header">
      <div class="card-icon"><i class="fa-solid fa-user-plus"></i></div>
      <h2>Create Account</h2>
      <p>Join the ABC CO Innovation platform today</p>
    </div>

    <form action="login.html">

      <div class="input-group">
        <label><i class="fa-solid fa-user"></i> Full Name</label>
        <input type="text" placeholder="Enter your full name" required>
      </div>

      <div class="input-group">
        <label><i class="fa-solid fa-envelope"></i> Email</label>
        <input type="email" placeholder="your@email.com" required>
      </div>

      <div class="input-group">
        <label><i class="fa-solid fa-school"></i> School Name</label>
        <input type="text" placeholder="Enter your school name" required>
      </div>

      <div class="input-group">
        <label><i class="fa-solid fa-lock"></i> Password</label>
        <div class="pass-wrap">
          <input type="password" id="password" placeholder="Create a password" required>
          <button type="button" class="pass-toggle" id="togglePass">
            <i class="fa-solid fa-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        Register <i class="fa-solid fa-arrow-right"></i>
      </button>

    </form>

    <div class="divider"><span>Already have an account?</span></div>

    <div class="login-link">
      <a href="login.html">Login Here →</a>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer>
  © 2026 ABC CO Rwanda &nbsp;|&nbsp; <a href="martha.html">Home</a> &nbsp;|&nbsp; <a href="contact.html">Contact</a>
</footer>

<script>
  // Hamburger
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
  });

  // Password toggle
  const togglePass = document.getElementById('togglePass');
  const password = document.getElementById('password');
  const toggleIcon = document.getElementById('toggleIcon');
  togglePass.addEventListener('click', () => {
    const isHidden = password.type === 'password';
    password.type = isHidden ? 'text' : 'password';
    toggleIcon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
  });
</script>

</body>
</html>
