<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#111,#1f1f1f);
overflow:hidden;
}

.login-box{
width:350px;
background:#1e1e1e;
padding:35px;
border-radius:15px;
box-shadow:0 0 25px rgba(255,215,0,0.2);
text-align:center;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
font-size:50px;
color:gold;
margin-bottom:15px;
}

h2{
color:white;
margin-bottom:25px;
}

.input-box{
position:relative;
margin-bottom:20px;
}

.input-box i{
position:absolute;
left:15px;
top:15px;
color:#999;
}

.input-box input{
width:100%;
padding:14px 14px 14px 45px;
border:none;
border-radius:10px;
outline:none;
background:#2a2a2a;
color:white;
font-size:15px;
}

.input-box input:focus{
border:1px solid gold;
}

.toggle-eye{
position:absolute;
right:15px;
top:15px;
color:#999;
cursor:pointer;
}

button{
width:100%;
padding:14px;
background:gold;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:orange;
transform:translateY(-2px);
}

button:disabled{
opacity:0.6;
cursor:not-allowed;
transform:none;
}

#error{
margin-top:15px;
color:red;
font-size:14px;
min-height:18px;
}

.forgot-link{
display:inline-block;
margin-top:16px;
color:#bbb;
font-size:13px;
text-decoration:none;
cursor:pointer;
transition:0.2s;
}

.forgot-link:hover{
color:gold;
text-decoration:underline;
}

.footer{
margin-top:20px;
font-size:13px;
color:#888;
}

/* Forgot password modal */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
z-index:10;
}

.overlay.show{
display:flex;
}

.modal{
width:340px;
background:#1e1e1e;
padding:30px;
border-radius:15px;
box-shadow:0 0 25px rgba(255,215,0,0.2);
text-align:center;
animation:fadeIn 0.3s ease;
position:relative;
}

.modal h3{
color:white;
margin-bottom:8px;
}

.modal p.desc{
color:#999;
font-size:13px;
margin-bottom:20px;
line-height:1.4;
}

.modal .close-btn{
position:absolute;
top:14px;
right:16px;
color:#999;
cursor:pointer;
font-size:16px;
}

.modal .close-btn:hover{
color:gold;
}

#resetMsg{
margin-top:14px;
font-size:14px;
min-height:18px;
}

#resetMsg.success{
color:#4caf50;
}

#resetMsg.error{
color:red;
}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">
<i class="fa-solid fa-user-shield"></i>
</div>

<h2>Admin Login</h2>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input
type="password"
id="password"
placeholder="Enter Admin Password"
autocomplete="current-password">
<i class="fa-solid fa-eye toggle-eye" id="toggleEye"></i>
</div>

<button id="loginBtn" onclick="loginAdmin()">
Login
</button>

<p id="error"></p>

<a class="forgot-link" id="forgotLink">Forgot Password?</a>

<div class="footer">
ABC CO MIS © 2026
</div>

</div>

<!-- Forgot password modal -->
<div class="overlay" id="overlay">
<div class="modal">
<span class="close-btn" id="closeModal"><i class="fa-solid fa-xmark"></i></span>
<h3>Reset Password</h3>
<p class="desc">Enter your admin email and we'll send you a link to reset your password.</p>

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input
type="email"
id="resetEmail"
placeholder="Enter Admin Email">
</div>

<button id="resetBtn" onclick="sendResetLink()">Send Reset Link</button>

<p id="resetMsg"></p>

</div>
</div>

<script>

const passwordInput = document.getElementById("password");
const errorEl = document.getElementById("error");
const loginBtn = document.getElementById("loginBtn");
const toggleEye = document.getElementById("toggleEye");

const forgotLink = document.getElementById("forgotLink");
const overlay = document.getElementById("overlay");
const closeModal = document.getElementById("closeModal");
const resetEmail = document.getElementById("resetEmail");
const resetBtn = document.getElementById("resetBtn");
const resetMsg = document.getElementById("resetMsg");

// Submit on Enter key, not just button click
passwordInput.addEventListener("keydown", function(e){
if(e.key === "Enter"){
loginAdmin();
}
});

// Clear error as soon as the user starts typing again
passwordInput.addEventListener("input", function(){
errorEl.innerText = "";
});

// Show/hide password
toggleEye.addEventListener("click", function(){
const isPassword = passwordInput.type === "password";
passwordInput.type = isPassword ? "text" : "password";
toggleEye.classList.toggle("fa-eye");
toggleEye.classList.toggle("fa-eye-slash");
});

function loginAdmin(){

const password = passwordInput.value.trim();

if(password === ""){
errorEl.innerText = "Please enter a password";
return;
}

// NOTE: this check is illustrative only — see message below.
if(password === "admin123"){

loginBtn.disabled = true;
loginBtn.innerText = "Logging in...";

localStorage.setItem("adminLoggedIn", "true");

window.location.href = "dashboard.html";

}
else{
errorEl.innerText = "Wrong Password";
passwordInput.value = "";
passwordInput.focus();
}

}

// ---- Forgot Password modal logic ----

function openModal(){
overlay.classList.add("show");
resetMsg.innerText = "";
resetMsg.className = "";
resetEmail.value = "";
resetEmail.focus();
}

function hideModal(){
overlay.classList.remove("show");
}

forgotLink.addEventListener("click", openModal);
closeModal.addEventListener("click", hideModal);

// Close modal when clicking outside it
overlay.addEventListener("click", function(e){
if(e.target === overlay){
hideModal();
}
});

// Close modal with Escape key
document.addEventListener("keydown", function(e){
if(e.key === "Escape" && overlay.classList.contains("show")){
hideModal();
}
});

// Submit reset request with Enter key
resetEmail.addEventListener("keydown", function(e){
if(e.key === "Enter"){
sendResetLink();
}
});

function isValidEmail(email){
return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function sendResetLink(){

const email = resetEmail.value.trim();

if(email === ""){
resetMsg.innerText = "Please enter your email";
resetMsg.className = "error";
return;
}

if(!isValidEmail(email)){
resetMsg.innerText = "Please enter a valid email address";
resetMsg.className = "error";
return;
}

// NOTE: this is a front-end simulation only.
// In production, this must call a backend endpoint that verifies
// the email belongs to an admin account and sends a real,
// time-limited reset link/token by email.
resetBtn.disabled = true;
resetBtn.innerText = "Sending...";

setTimeout(function(){
resetMsg.innerText = "If that email is registered, a reset link has been sent.";
resetMsg.className = "success";
resetBtn.disabled = false;
resetBtn.innerText = "Send Reset Link";
}, 1000);

}

</script>

</body>
</html>
